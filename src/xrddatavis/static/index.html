<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xrddatavis — live plots</title>
    <link rel="stylesheet" href="static/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 13 L5 13 L6 4 L8 12 L10 8 L15 8' fill='none' stroke='%232a78d6' stroke-width='1.6'/%3E%3C/svg%3E"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.1.1/plotly.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>xrddatavis</h1>
        <span class="subtitle">live XYE plot server</span>
      </div>
      <div class="status">
        <span class="pill" id="capacity" title="Plots held / maximum allowed">— / —</span>
        <span class="pill" id="ttl-pill" title="Plots are cleared this long after arriving">ttl —</span>
        <span class="pill conn" id="conn" data-state="down" title="Live update stream">
          <i class="dot"></i><span id="conn-label">connecting</span>
        </span>
        <button class="btn" id="theme-toggle" title="Switch light / dark">◐</button>
      </div>
    </header>

    <main>
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="search-row">
            <input
              id="filter"
              type="search"
              placeholder="Filter by name, file or scan number…"
              autocomplete="off"
              aria-label="Filter plots"
            />
            <button class="btn" id="reset-filters" hidden title="Clear all filters">
              Reset
            </button>
          </div>

          <div class="facet-row" id="type-tabs-row" hidden>
            <span class="facet-label">Type</span>
            <div class="chip-group" id="type-tabs" role="tablist" aria-label="Filter by data type"></div>
          </div>

          <div class="facet-row" id="filenumber-row" hidden>
            <span class="facet-label">File #</span>
            <div
              class="chip-group"
              id="filenumber-chips"
              role="group"
              aria-label="Filter by file number"
            ></div>
          </div>

          <div class="row-actions">
            <button class="btn" id="select-all">Select all</button>
            <button class="btn" id="select-none">Deselect all</button>
            <button class="btn" id="upload-btn" title="Plot a 2 or 3 column data file">
              Upload file…
            </button>
            <button class="btn danger" id="clear-all" title="Delete every plot on the server">
              Clear server
            </button>
          </div>
        </div>

        <div class="table-wrap">
          <table id="plot-table">
            <thead>
              <tr>
                <th class="plain" scope="col"><span class="sr-only">Show</span></th>
                <th data-sort="name" data-label="Name" scope="col">Name</th>
                <th data-sort="points" data-label="Pts" class="num" scope="col">Pts</th>
                <th data-sort="created_at" data-label="TTL" class="num" scope="col">TTL</th>
                <th class="plain" scope="col"><span class="sr-only">Delete</span></th>
              </tr>
            </thead>
            <tbody id="plot-rows"></tbody>
          </table>
        </div>

        <div class="sidebar-foot">
          <span id="selected-count">0 shown</span>
          <span id="updated-at"></span>
        </div>

        <div
          class="sidebar-resizer"
          id="sidebar-resizer"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize the plot list"
          aria-valuemin="300"
          aria-valuemax="720"
          tabindex="0"
        ></div>
      </aside>

      <section class="content">
        <div class="toolbar">
          <div class="group">
            <span class="group-label">Layout</span>
            <div class="segmented" id="mode" role="group" aria-label="Plot layout">
              <button data-mode="overlay" aria-pressed="true" title="All traces on one pair of axes">
                Overlay
              </button>
              <button data-mode="offset" aria-pressed="false" title="Overlay with a vertical offset per trace (waterfall)">
                Offset
              </button>
              <button data-mode="grid" aria-pressed="false" title="One panel per trace">
                Grid
              </button>
            </div>
          </div>

          <div class="group">
            <label class="check"
              ><input type="checkbox" id="opt-errors" checked /> Error bars</label
            >
            <label class="check"><input type="checkbox" id="opt-fits" checked /> Fits</label>
            <label class="check"><input type="checkbox" id="opt-logy" /> Log y</label>
            <label class="check"
              ><input type="checkbox" id="opt-normalise" /> Normalise</label
            >
          </div>

          <div class="group">
            <button class="btn" id="reset-zoom" title="Reset the axes">Reset view</button>
          </div>
        </div>

        <div class="chart-area">
          <div id="chart"></div>
          <div class="overlay-msg" id="overlay-msg" hidden></div>
        </div>
      </section>
    </main>

    <dialog id="upload-dialog" class="upload-dialog">
      <form id="upload-form">
        <h2>Upload a column file</h2>
        <p class="hint">
          Two or three columns - x, y, and optionally an error column e - separated
          by commas, tabs, semicolons or spaces. Lines starting with # are ignored.
        </p>

        <label class="field">
          <span>File</span>
          <input
            type="file"
            id="upload-file"
            accept=".csv,.tsv,.txt,.dat,.xy,.xye,.gr,.sq,.fq,.iq"
            required
          />
        </label>

        <div class="field-row">
          <label class="field">
            <span>Delimiter</span>
            <select id="upload-delimiter">
              <option value="auto" selected>Auto-detect</option>
              <option value=",">Comma ( , )</option>
              <option value="tab">Tab</option>
              <option value=";">Semicolon ( ; )</option>
              <option value="ws">Whitespace</option>
            </select>
          </label>
          <label class="check" style="align-self: center">
            <input type="checkbox" id="upload-header" /> First row is a header
          </label>
        </div>

        <div class="field-row">
          <label class="field">
            <span>Name</span>
            <input type="text" id="upload-name" placeholder="from filename" />
          </label>
          <label class="field">
            <span>Data type</span>
            <input
              type="text"
              id="upload-datatype"
              list="upload-datatype-options"
              placeholder="optional"
            />
            <datalist id="upload-datatype-options">
              <option value="pxrd"></option>
              <option value="iq"></option>
              <option value="sq"></option>
              <option value="fq"></option>
              <option value="gr"></option>
            </datalist>
          </label>
          <label class="field">
            <span>File #</span>
            <input type="number" id="upload-filenumber" placeholder="optional" />
          </label>
        </div>

        <div class="upload-preview" id="upload-preview" hidden></div>
        <div class="upload-error" id="upload-error" hidden></div>

        <div class="dialog-actions">
          <button type="button" class="btn" id="upload-cancel">Cancel</button>
          <button type="submit" class="btn primary" id="upload-submit" disabled>
            Plot it
          </button>
        </div>
      </form>
    </dialog>

    <script src="static/app.js"></script>
  </body>
</html>
