on:
  workflow_call:

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        # the frontend (frontend/readme.md) is never committed - build it
        # into src/xrpddatavis/static so the sdist/wheel actually ships a UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Build sdist and wheel
        run: >
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct) &&
          uvx --from build pyproject-build

      - name: Upload sdist and wheel as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

      - name: Check for packaging errors
        run: uvx twine check --strict dist/*

      - name: Install produced wheel
        run: python -m pip install dist/*.whl

      - name: Test module --version works using the installed wheel
        # If more than one module in src/ replace with module name to test
        run: python -m $(ls --hide='*.egg-info' src | head -1) --version

      - name: Check the frontend was packaged into the wheel
        run: |
          python -c "
          import importlib.resources, sys
          index = importlib.resources.files('xrpddatavis') / 'static' / 'index.html'
          if not index.is_file():
              sys.exit(f'{index} missing from the installed wheel - frontend build step failed?')
          print(f'found {index}')
          "
