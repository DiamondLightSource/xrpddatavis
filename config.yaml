beamline:
  name: "ixx" # beamline this instance is deployed on, shown in the UI title bar

server:
  host: "localhost"
  port: 8000
  suppress_polling_logs: true

plots:
  max_plots: 20 # maximum number of plots held/displayable at once
  ttl_seconds: 3600 # time to live of a plot before it is cleared
  max_points: 1000000 # largest single trace accepted by POST /plot

cleanup:
  interval_seconds: 300 #frequency of checking for deletable results

auth:
  # off for local runs, as there's no oauth2-proxy to log you in. Set true to
  # test tokens from the real Keycloak - see README.md, "Authentication"
  enabled: false
  issuer: "https://identity.diamond.ac.uk/realms/dls"
  client_audience: "account"
