replicaCount: 1

image:
  repository: ghcr.io/diamondlightsource/xrddatavis
  pullPolicy: Always
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 2
    memory: 12Gi
    ephemeral-storage: 4Gi
  requests:
    cpu: 1
    memory: 4Gi
    ephemeral-storage: 4Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 30
  failureThreshold: 3
  timeoutSeconds: 5
startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 9
  timeoutSeconds: 5


config:
  server:
    host: "0.0.0.0"
    port: 8000
    suppress_polling_logs: false
  beamline:
    # which beamline this deployment serves, e.g. "i15-1" - shown in the UI
    # title bar. Set per beamline, e.g. --set config.beamline.name=i15-1
    name: ""
  queue:
    workers: 4
  plots:
    # maximum number of plots held - and therefore displayable - at once.
    # Posting past this evicts the oldest plot.
    max_plots: 20
    # a plot is cleared automatically this long after it arrives
    ttl_seconds: 3600
    # largest single trace accepted by POST /plot
    max_points: 1000000
  cleanup:
    # how often expired plots are swept up
    interval_seconds: 300
  uvicorn:
    workers: 1
  logging:
    graylog:
      enabled: false
      url: ""
      level: "INFO"
    stream:
      enabled: true
      level: "DEBUG"

volumeMounts: []
volumes: []
nodeSelector: {}
tolerations: []
