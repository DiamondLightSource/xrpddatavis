replicaCount: 1

image:
  repository: ghcr.io/diamondlightsource/xrpddatavis
  pullPolicy: Always
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations:
    # oauth2-proxy's session cookie can outgrow nginx's default 4k header
    # buffer, which shows up as a 502 straight after logging in
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
  hosts: []
  tls: []

resources:
  limits:
    cpu: 2
    memory: 12Gi
    ephemeral-storage: 4Gi
  requests:
    cpu: 1
    memory: 4Gi
    ephemeral-storage: 4Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 30
  failureThreshold: 3
  timeoutSeconds: 5
startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 9
  timeoutSeconds: 5


config:
  server:
    host: "0.0.0.0"
    port: 8000
    suppress_polling_logs: false
  beamline:
    # which beamline this deployment serves, e.g. "i15-1" - shown in the UI
    # title bar. Set per beamline, e.g. --set config.beamline.name=i15-1
    name: ""
  plots:
    # maximum number of plots held - and therefore displayable - at once.
    # Posting past this evicts the oldest plot.
    max_plots: 20
    # a plot is cleared automatically this long after it arrives
    ttl_seconds: 3600
    # largest single trace accepted by POST /plot
    max_points: 1000000
    # sqlite file the plots are kept in. Must live under persistence.mountPath
    # for plots to survive a pod restart.
    db_path: /data/plots.db
  cleanup:
    # how often expired plots are swept up
    interval_seconds: 300
  logging:
    graylog:
      enabled: false
      url: ""
      level: "INFO"
    stream:
      enabled: true
      level: "DEBUG"

auth:
  enabled: true
  # the Keycloak realm users log in against - used by oauth2-proxy and the app
  issuer: https://identity.diamond.ac.uk/realms/dls
  # the "aud" claim the app requires in access tokens. "account" is in every
  # token from the realm; once Keycloak adds an audience mapper for this app's
  # client, set it to the client ID so tokens issued to other apps are refused
  client_audience: account
  # Diamond's policy service rule for "may this user see this instrument
  # session" - plots in sessions a user can't see are hidden from them
  opa_url: https://opa.diamond.ac.uk/v1/data/diamond/policy/session/access
  # what oauth2-proxy asks Keycloak for - matches Atlas
  scope: openid email profile offline_access posix-uid
  # how long a login lasts before the user has to log in again
  cookieExpire: 168h
  # extra lines for oauth2-proxy's config file, see
  # https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview
  extraConfig: ""

# the oauth2-proxy sub-chart's own values, see
# https://github.com/oauth2-proxy/manifests/tree/main/helm/oauth2-proxy
oauth2-proxy:
  extraArgs:
    skip-provider-button: "true"
    standard-logging: "true"
    request-logging: "true"
    auth-logging: "true"
    show-debug-on-error: "true"
  # traffic arrives through this chart's ingress instead
  ingress:
    enabled: false
  config:
    # the SealedSecret in templates/keycloak_secret.yaml - holds client-id,
    # client-secret and cookie-secret
    existingSecret: xrpddatavis-keycloak-secret
    # made by templates/oauth2-proxy-config.yaml
    existingConfig: xrpddatavis-oauth2-proxy-config
  alphaConfig:
    enabled: true
    # made by templates/oauth2-proxy-config.yaml
    existingSecret: xrpddatavis-oauth2-alpha-config
  service:
    portNumber: 4180

# a PersistentVolumeClaim mounted at mountPath, holding config.plots.db_path
persistence:
  enabled: true
  # use an existing claim rather than creating one
  existingClaim: ""
  mountPath: /data
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  annotations:
    helm.sh/resource-policy: keep # don't delete the PVC (and the plots) on helm uninstall

volumeMounts: []
volumes: []
nodeSelector: {}
tolerations: []
