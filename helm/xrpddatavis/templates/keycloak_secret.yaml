{{- if .Values.auth.enabled }}
# The Keycloak client credentials oauth2-proxy logs users in with. Each value
# is encrypted with `kubeseal` for this namespace and secret name - see
# helm/README.md for how to make them. Encrypted values are safe to commit;
# only the cluster's sealed-secrets controller can decrypt them.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ index .Values "oauth2-proxy" "config" "existingSecret" }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    client-id: ""
    client-secret: ""
    cookie-secret: ""
  template:
    metadata:
      name: {{ index .Values "oauth2-proxy" "config" "existingSecret" }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
