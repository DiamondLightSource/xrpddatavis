<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xrddatavis — live plots</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 13 L5 13 L6 4 L8 12 L10 8 L15 8' fill='none' stroke='%232a78d6' stroke-width='1.6'/%3E%3C/svg%3E"
    />
    <!--
      Plotly is loaded as a global from the CDN rather than bundled, so the
      main bundle stays small - PlotlyChart.tsx talks to window.Plotly.
      Pin the exact version; see the "External resources" note in server docs.
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.1.1/plotly.min.js"></script>
    <script>
      // Set data-mode before React mounts, so the correct DiamondDS token set
      // applies on first paint (see sci-react-ui docs: Avoiding Dark Mode Flicker).
      (function () {
        try {
          var mode = localStorage.getItem("mui-mode");
          if (mode === "light" || mode === "dark") {
            document.documentElement.setAttribute("data-mode", mode);
          }
        } catch (e) {
          /* private window or blocked storage */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
